<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clothing Classifier</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #f7f7f7, #e3f2fd);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #0d47a1;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        form {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 12px 20px;
            cursor: pointer;
            background-color: #1976d2;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            transition: background-color 0.3s ease;
            margin-bottom: 10px;
        }

        .custom-file-upload:hover {
            background-color: #0d47a1;
        }

        input[type="file"] {
            display: none;
        }

        #file-name {
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #555;
        }

        input[type="submit"] {
            background-color: #388e3c;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #2e7d32;
        }

        h2 {
            margin-top: 30px;
            color: #1b5e20;
        }

        p {
            font-size: 1.1rem;
            color: #333;
        }

        strong {
            color: #000;
        }
    </style>
</head>
<body>
    <h1>Upload Clothing Image</h1>
    <form action="/" method="post" enctype="multipart/form-data">
        <label for="file-upload" class="custom-file-upload">Choose Image</label>
        <input id="file-upload" type="file" name="file" required>
        <div id="file-name">No file chosen</div>
        <input type="submit" value="Predict">
    </form>

    {% if prediction %}
        <h2>Prediction Result</h2>
        <p><strong>Label:</strong> {{ prediction.label }}</p>
        <p><strong>Confidence:</strong> {{ prediction.confidence }}%</p>
    {% endif %}

    <script>
        const fileInput = document.getElementById('file-upload');
        const fileNameDisplay = document.getElementById('file-name');

        fileInput.addEventListener('change', () => {
            const fileName = fileInput.files.length > 0 ? fileInput.files[0].name : 'No file chosen';
            fileNameDisplay.textContent = fileName;
        });
    </script>
</body>
</html>
